[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsuck"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "yt-dlp[default,curl-cffi]>=2026.10.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.2.1",
  "av<16",
  "nvidia-cublas-cu12==12.9.2.10",
]
dev = ["pytest>=8"]

[project.scripts]
brainsuck = "brainsuck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: hits YouTube for real (run with -m network)",
  "gpu: needs CUDA + Whisper model (run with -m gpu)",
]
addopts = "-m 'not network and not gpu'"

[tool.setuptools.package-data]
brainsuck = ["templates/*.md"]
